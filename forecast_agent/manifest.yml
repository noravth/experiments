applications:
  - name: forecast-agent-codeconnect26
    stack: cflinuxfs5
    memory: 1024M
    disk_quota: 4096M
    instances: 1
    buildpacks:
      - https://github.com/cloudfoundry/python-buildpack/releases/download/v1.9.4/python-buildpack-cflinuxfs5-v1.9.4.zip
    health-check-type: http
    health-check-http-endpoint: /health
    timeout: 180
    command: python -m uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    services:
      - aicore
    env:
      LITELLM_PROVIDER: sap
      AICORE_RESOURCE_GROUP: default
      BP_PYTHON_VERSION: "3.13.11"
      HANA_HOST: c5889dd5-e0f6-4930-8408-94d53ca61dbf.hna0.prod-us10.hanacloud.ondemand.com
      HANA_PORT: 443
      HANA_USER: SANDBOX
